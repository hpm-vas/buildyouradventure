<div class="pin-gate">
  <h2>Enter PIN</h2>
  
  <div class="pin-display">
    @for (i of [0,1,2,3,4,5]; track i) {
      <span class="pin-dot" [class.filled]="pin().length > i">●</span>
    }
  </div>

  <div class="numpad">
    @for (digit of ['1','2','3','4','5','6','7','8','9','C','0','→']; track digit) {
      <button 
        (click)="digit === 'C' ? clear() : digit === '→' ? submit() : enterDigit(digit)"
        [class.action]="digit === 'C' || digit === '→'"
      >
        {{ digit }}
      </button>
    }
  </div>
</div>
