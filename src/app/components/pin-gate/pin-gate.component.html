<div class="pin-gate" [class.shake]="shake()">
  <h2>Enter PIN</h2>
  
  <div class="pin-display" [class.loading]="isLoading()">
    @for (i of [0,1,2,3,4,5]; track i) {
      <span class="pin-dot" [class.filled]="pin().length > i">●</span>
    }
  </div>

  @if (errorMessage()) {
    <p class="error-message">{{ errorMessage() }}</p>
  }

  <div class="numpad" [class.disabled]="isLoading()">
    @for (digit of ['1','2','3','4','5','6','7','8','9','⌫','0','→']; track digit) {
      <button 
        (click)="digit === '⌫' ? backspace() : digit === '→' ? submit() : enterDigit(digit)"
        [class.action]="digit === '⌫' || digit === '→'"
        [disabled]="isLoading()"
      >
        {{ digit }}
      </button>
    }
  </div>

  @if (isLoading()) {
    <p class="loading-text">Verifying...</p>
  }
</div>
