<header class="app-header">
  <h1>{{ title }}</h1>
  <nav>
    @if (sharedStory.hasStorySelected()) {
      <span class="current-story">{{ sharedStory.currentStoryName() }}</span>
      <a routerLink="/story">Story so far</a>
      <a routerLink="/gamemaster">Builder</a>
      <button class="leave-story-btn" (click)="leaveStory()">Leave Story</button>
    } @else {
      <a routerLink="/select-story">Select Story</a>
    }
    @if (user()) {
      <span class="user-info">{{ user()?.name }}</span>
      <button class="logout-btn" (click)="logout()">Switch Role</button>
    }
  </nav>
</header>

<main class="app-content">
  <router-outlet></router-outlet>
</main>
